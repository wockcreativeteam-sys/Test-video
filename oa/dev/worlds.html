<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Worlds preview</title>
<style>
  html, body { margin: 0; background: #0d0518; color: #cbbcff; font: 12px/1.4 ui-monospace, monospace; }
  canvas { display: block; }
  #hud { position: fixed; left: 10px; top: 8px; opacity: 0.7; pointer-events: none; white-space: pre; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud"></div>
<script type="module">
// Preview harness for oa/src/lib/worlds.js (dev only; not part of the film).
//   worlds.html?view=world&name=school&t=0.3   one world from the shot-03 camera (+ stick figure)
//   worlds.html?view=exam                       the shot-08 examination room (+ two figures)
//   worlds.html?view=frag                        the four memory fragments
//   worlds.html?view=sheet                       contact sheet of everything (1920x1440)
//   &cam=px,py,pz,tx,ty,tz,fov  override camera   &hud=0  hide stats   &fig=0  hide figures
//   &mirror=0|1  screen-x flip (default: on for the shot-03 camera, as walkerCam() sets F.cam.mirror)
import { WORLD_ORDER, buildWorld, FRAGMENTS, buildFragment, buildExamRoom } from '../src/lib/worlds.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'world';
const T = +(q.get('t') ?? 0.3);
const seed = +(q.get('seed') ?? 1);
const showHud = q.get('hud') !== '0';
const showFig = q.get('fig') !== '0';

const mq = q.get('mirror');
const CAM03 = { pos: [-1.2, 1.3, -6.5], tgt: [0.6, 1.0, 0.0], fov: 35, mirror: mq === null ? true : mq === '1' };
const CAM08 = { pos: [0.5, 1.35, -7.5], tgt: [0.3, 1.1, 1.0], fov: 38, mirror: mq === '1' };
const camOverride = q.get('cam') ? q.get('cam').split(',').map(Number) : null;

// --- pinhole camera, same convention as oa/src/engine/cam.js (r = f x up, screen y down)
function makeCam(spec, W, H) {
  const pos = camOverride ? camOverride.slice(0, 3) : spec.pos;
  const tgt = camOverride ? camOverride.slice(3, 6) : spec.tgt;
  const fov = camOverride ? camOverride[6] : spec.fov;
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const nrm = (a) => { const l = Math.hypot(...a) || 1; return a.map((v) => v / l); };
  const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const f = nrm(sub(tgt, pos));
  const r = nrm(crs(f, [0, 1, 0]));
  const u = crs(r, f);
  const focal = H / 2 / Math.tan((fov * Math.PI) / 360);
  const mx = spec.mirror ? -1 : 1;
  return {
    W, H,
    project(x, y, z) {
      const dx = x - pos[0], dy = y - pos[1], dz = z - pos[2];
      const zc = dx * f[0] + dy * f[1] + dz * f[2];
      if (zc < 0.05) return null;
      const k = focal / zc;
      return [W / 2 + mx * (dx * r[0] + dy * r[1] + dz * r[2]) * k, H / 2 - (dx * u[0] + dy * u[1] + dz * u[2]) * k, zc, k];
    },
  };
}

const LINE = '208,192,255';
const ANIM = '255,206,236';
const FIG = '255,236,214';

function background(ctx, x, y, w, h) {
  const g = ctx.createRadialGradient(x + w * 0.55, y + h * 0.45, 0, x + w * 0.55, y + h * 0.45, Math.max(w, h) * 0.75);
  g.addColorStop(0, '#2a1046');
  g.addColorStop(0.55, '#1a0a2e');
  g.addColorStop(1, '#0c0416');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
}

// stroke 3D polylines into ctx (already clipped to a viewport by the caller)
function strokeLines(ctx, cam, lines, rgb, scale = 1, fog = [7, 16]) {
  for (const L of lines) {
    const p = L.p, n = p.length / 3, w = L.w ?? 0.5;
    const base = 0.2 + 0.78 * w;
    ctx.lineWidth = (0.75 + 0.85 * w) * scale;
    let prev = null;
    const segs = L.closed ? n : n - 1;
    ctx.beginPath();
    let zsum = 0, zc = 0;
    for (let s = 0; s <= segs; s++) {
      const i = (s % n) * 3;
      const P = cam.project(p[i], p[i + 1], p[i + 2]);
      if (!P) { prev = null; continue; }
      zsum += P[2]; zc++;
      if (!prev) ctx.moveTo(P[0], P[1]);
      else ctx.lineTo(P[0], P[1]);
      prev = P;
    }
    const z = zc ? zsum / zc : 10;
    const fk = Math.min(1, Math.max(0, (z - fog[0]) / (fog[1] - fog[0])));
    ctx.strokeStyle = `rgba(${rgb},${(base * (1 - 0.5 * fk)).toFixed(3)})`;
    ctx.stroke();
  }
}

function strokeDots(ctx, cam, dots, rgb, scale = 1) {
  if (!dots) return;
  for (let i = 0; i < dots.length; i += 3) {
    const P = cam.project(dots[i], dots[i + 1], dots[i + 2]);
    if (!P) continue;
    ctx.fillStyle = `rgba(${rgb},0.95)`;
    ctx.beginPath();
    ctx.arc(P[0], P[1], Math.max(1.1, Math.min(3.2, P[3] * 0.012)) * scale, 0, Math.PI * 2);
    ctx.fill();
  }
}

// a neutral scale figure: a walking woman 1.6 m tall, as simple 3D strokes
function walker(x0 = 0, z0 = 0, seated = false) {
  const L = [];
  const P = (pts) => L.push({ p: new Float32Array(pts.flat()), w: 1 });
  const head = [];
  for (let i = 0; i <= 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    head.push([x0 + 0.03 + Math.cos(a) * 0.1, (seated ? 1.18 : 1.5) + Math.sin(a) * 0.115, z0]);
  }
  P(head);
  if (seated) {
    P([[x0, 1.06, z0], [x0 + 0.05, 0.5, z0]]);
    P([[x0 + 0.05, 0.5, z0 - 0.08], [x0 - 0.38, 0.47, z0 - 0.08], [x0 - 0.4, 0.02, z0 - 0.08]]);
    P([[x0 + 0.05, 0.5, z0 + 0.08], [x0 - 0.38, 0.47, z0 + 0.08], [x0 - 0.42, 0.02, z0 + 0.08]]);
    P([[x0, 0.98, z0 - 0.1], [x0 - 0.12, 0.72, z0 - 0.12], [x0 - 0.3, 0.66, z0 - 0.12]]);
    P([[x0, 0.98, z0 + 0.1], [x0 - 0.1, 0.72, z0 + 0.12], [x0 - 0.28, 0.68, z0 + 0.12]]);
    return L;
  }
  P([[x0 + 0.02, 1.38, z0], [x0, 0.92, z0]]); // torso
  P([[x0, 0.92, z0 - 0.07], [x0 + 0.17, 0.48, z0 - 0.07], [x0 + 0.3, 0.04, z0 - 0.07], [x0 + 0.4, 0.02, z0 - 0.07]]);
  P([[x0, 0.92, z0 + 0.07], [x0 - 0.12, 0.5, z0 + 0.07], [x0 - 0.3, 0.12, z0 + 0.07], [x0 - 0.22, 0.02, z0 + 0.07]]);
  P([[x0 + 0.02, 1.33, z0 - 0.17], [x0 - 0.1, 1.07, z0 - 0.19], [x0 - 0.16, 0.84, z0 - 0.19]]);
  P([[x0 + 0.02, 1.33, z0 + 0.17], [x0 + 0.14, 1.08, z0 + 0.19], [x0 + 0.26, 0.88, z0 + 0.19]]);
  return L;
}

function stats(W) {
  let pts = 0;
  for (const L of W.lines) pts += L.p.length / 3;
  const ws = { 1: 0, 0.5: 0, 0.2: 0 };
  for (const L of W.lines) ws[L.w >= 0.75 ? 1 : L.w >= 0.35 ? 0.5 : 0.2]++;
  return { lines: W.lines.length, points: pts, dots: W.dots ? W.dots.length / 3 : 0, ws };
}

function drawScene(ctx, x, y, w, h, W, camSpec, figs, t, scale = 1) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  background(ctx, x, y, w, h);
  const cam = makeCam(camSpec, w, h);
  // line layer + glow
  const L = document.createElement('canvas');
  L.width = w; L.height = h;
  const lc = L.getContext('2d');
  lc.lineCap = 'round';
  lc.lineJoin = 'round';
  strokeLines(lc, cam, W.lines, LINE, scale);
  const anim = W.anim ? W.anim(t) : [];
  strokeLines(lc, cam, anim, ANIM, scale);
  strokeDots(lc, cam, W.dots, '255,226,170', scale);
  if (showFig && figs) strokeLines(lc, cam, figs, FIG, scale * 1.4);
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = `blur(${(5 * scale).toFixed(1)}px)`;
  ctx.globalAlpha = 0.85;
  ctx.drawImage(L, x, y);
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
  ctx.drawImage(L, x, y);
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  return { anim: anim.length };
}

function drawFragment(ctx, cx, cy, size, polys, label) {
  const L = document.createElement('canvas');
  L.width = ctx.canvas.width; L.height = ctx.canvas.height;
  const lc = L.getContext('2d');
  lc.lineCap = 'round'; lc.lineJoin = 'round';
  lc.strokeStyle = `rgba(${LINE},0.95)`;
  lc.lineWidth = Math.max(1.2, size / 220);
  for (const p of polys) {
    lc.beginPath();
    for (let i = 0; i < p.length; i += 2) {
      const X = cx + p[i] * size, Y = cy - p[i + 1] * size;
      if (i === 0) lc.moveTo(X, Y); else lc.lineTo(X, Y);
    }
    lc.stroke();
  }
  // frame of the unit square
  lc.strokeStyle = 'rgba(208,192,255,0.12)';
  lc.lineWidth = 1;
  lc.strokeRect(cx - size / 2, cy - size / 2, size, size);
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(4px)';
  ctx.drawImage(L, 0, 0);
  ctx.filter = 'none';
  ctx.drawImage(L, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  if (label) {
    ctx.fillStyle = 'rgba(208,192,255,0.6)';
    ctx.font = `${Math.round(size / 18)}px ui-monospace, monospace`;
    ctx.fillText(`${label}  (${polys.length} polylines)`, cx - size / 2, cy + size / 2 + size / 12);
  }
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const out = {};

if (view === 'world' || view === 'exam') {
  const name = q.get('name') || 'school';
  const W = view === 'exam' ? buildExamRoom(seed) : buildWorld(name, seed);
  const figs = view === 'exam' ? [...walker(0, 0.5), ...walker(2.2, 1.6, true)] : walker(0, 0);
  const r = drawScene(ctx, 0, 0, 1920, 1080, W, view === 'exam' ? CAM08 : CAM03, figs, T);
  Object.assign(out, stats(W), { name: W.name, animLines: r.anim });
  if (showHud) hud.textContent = `${W.name}  lines ${out.lines}  points ${out.points}  dots ${out.dots}  anim ${r.anim}  t=${T}`;
} else if (view === 'frag') {
  background(ctx, 0, 0, 1920, 1080);
  FRAGMENTS.forEach((f, i) => drawFragment(ctx, 240 + i * 480, 500, 400, buildFragment(f), f));
} else if (view === 'sheet') {
  canvas.width = 1920; canvas.height = 1440;
  const cw = 640, ch = 360;
  const cells = [...WORLD_ORDER.map((n) => ['w', n]), ['exam'], ['frag', 0], ['frag', 2]];
  cells.forEach((c, i) => {
    const x = (i % 3) * cw, y = Math.floor(i / 3) * ch;
    if (c[0] === 'w') {
      drawScene(ctx, x, y, cw, ch, buildWorld(c[1], seed), CAM03, walker(0, 0), T, 1 / 3);
    } else if (c[0] === 'exam') {
      drawScene(ctx, x, y, cw, ch, buildExamRoom(seed), CAM08, [...walker(0, 0.5), ...walker(2.2, 1.6, true)], T, 1 / 3);
    } else {
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, cw, ch); ctx.clip();
      background(ctx, x, y, cw, ch);
      const a = FRAGMENTS[c[1]], b = FRAGMENTS[c[1] + 1];
      drawFragment(ctx, x + cw * 0.27, y + ch * 0.46, 250, buildFragment(a), a);
      drawFragment(ctx, x + cw * 0.73, y + ch * 0.46, 250, buildFragment(b), b);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(208,192,255,0.55)';
    ctx.font = '15px ui-monospace, monospace';
    ctx.fillText(c[0] === 'w' ? `${i + 1}  ${c[1]}` : c[0] === 'exam' ? 'exam room (shot 08)' : 'fragments', x + 10, y + 22);
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
  });
}

window.__stats = out;
window.__done = true;
</script>
</body>
</html>
