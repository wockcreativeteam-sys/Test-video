    <script type="module">
      import * as THREE from "three";

      const W = 1920, H = 1080;
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return { c, g, t }; }
      const sets = [];
      function mkSet() { const g = new THREE.Group(); scene.add(g); g.visible = false; sets.push(g); return g; }
      function room(g, wall, floor, w = 14, d = 9, h = 4.2, fr = 0.5, fm = 0) {

        const g = new THREE.Group();
        const skin = std(C.skin, { roughness: 0.55 }), tm = std(top, { roughness: 0.7 }), pm = std(pants, { roughness: 0.65 });

        };
        const l = arm(1, armL), r = arm(-1, armR);
        g.scale.setScalar(scale); g.position.y = y; g.userData = { l, r };

      const clip = rbox(0.3, 0.4, 0.02, std(0xf1f5fb, { roughness: 0.6 }), -0.38, 1.17, -0.15, 0.01); clip.rotation.set(-0.25, 0.35, 0.12); s1.add(clip);
      const pen = mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.2, 10), phys(C.red), -0.25, 1.32, 0.0); pen.rotation.set(0.5, 0, 0.5); s1.add(pen);
      const k1 = new THREE.SpotLight(0xffe1b0, 90, 14, 0.7, 0.6, 1.4); k1.position.set(-2.5, 4, 2.5); k1.target.position.set(-0.2, 1.2, -0.6); k1.castShadow = true; k1.shadow.mapSize.set(1024, 1024); s1.add(k1, k1.target);

      /* ---------- SET 2: ward ---------- */
      const s2 = mkSet(); room(s2, 0x3a5f92, 0x1c2f4d, 16, 9, 4.2, 0.3, 0.05);
      for (const x of [-4.2, 0, 4.2]) {
        s2.add(rbox(2.2, 0.35, 1.05, std(0xc9d6ea, { roughness: 0.5, metalness: 0.4 }), x, 0.42, -2.6, 0.04));

      const w2 = human({ hair: "short", top: C.coat, armL: [0, 0.15], armR: [-1.0, -0.3] }); w2.position.set(2.1, 0, -1.2); w2.rotation.y = -0.5; s2.add(w2);

      const lamp = mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.06, 40), new THREE.MeshBasicMaterial({ color: 0xffe28a, toneMapped: false }), 3.0, 3.9, -2.2); lamp.castShadow = false; s2.add(lamp);
      const lp = new THREE.PointLight(0xffd98a, 60, 14, 1.5); lp.position.set(3.0, 3.4, -1.6); s2.add(lp);
      const k2 = new THREE.SpotLight(0xffffff, 120, 18, 0.9, 0.7, 1.3); k2.position.set(-1, 4.2, 3); k2.target.position.set(0, 1, -1.6); k2.castShadow = true; k2.shadow.mapSize.set(1024, 1024); s2.add(k2, k2.target);
      s2.add(new THREE.HemisphereLight(0x9cc7ff, 0x1c2f4d, 1.0));

      /* ---------- SET 3: clinic ---------- */
      const s3 = mkSet(); room(s3, 0x4f86c7, 0x2a3f66, 14, 9, 4.2, 0.45, 0);
      s3.add(rbox(3.0, 0.08, 1.1, phys(0xe9a92a, { roughness: 0.4, clearcoat: 0.5 }), 0, 0.76, -1.6, 0.03));

      const doc = human({ hair: "short", armL: [-0.4, 0.2], armR: [-0.3, -0.2] }); doc.position.set(-0.8, 0, -2.4); doc.rotation.y = 0.25; s3.add(doc);

      const clockFace = canvasTex(512, 512, (g) => { g.fillStyle = "#fff"; g.beginPath(); g.arc(256, 256, 250, 0, 7); g.fill(); g.strokeStyle = "#12206a"; g.lineWidth = 14; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; g.beginPath(); g.moveTo(256 + Math.sin(a) * 205, 256 - Math.cos(a) * 205); g.lineTo(256 + Math.sin(a) * 235, 256 - Math.cos(a) * 235); g.stroke(); } g.lineWidth = 18; g.beginPath(); g.moveTo(256, 256); g.lineTo(256, 130); g.stroke(); g.beginPath(); g.moveTo(256, 256); g.lineTo(330, 290); g.stroke(); });
      const clockRim = mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.1, 48), phys(C.yel, { roughness: 0.25 }), 2.6, 2.7, -4.3); clockRim.rotation.x = Math.PI / 2; s3.add(clockRim);
      const clockF = new THREE.Mesh(new THREE.CircleGeometry(0.55, 48), new THREE.MeshBasicMaterial({ map: clockFace.t, toneMapped: false })); clockF.position.set(2.6, 2.7, -4.24); s3.add(clockF);
      const k3 = new THREE.SpotLight(0xfff0d8, 130, 18, 0.9, 0.7, 1.3); k3.position.set(-2, 4.2, 3.5); k3.target.position.set(0, 1, -2); k3.castShadow = true; k3.shadow.mapSize.set(1024, 1024); s3.add(k3, k3.target);
      s3.add(new THREE.HemisphereLight(0xcfe4ff, 0x2a3f66, 1.1));

      /* ---------- SET 4: phone ---------- */
      const s4 = mkSet();
      const bg4 = canvasTex(8, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#63b8f7"); gr.addColorStop(0.6, "#2f62c9"); gr.addColorStop(1, "#1c2a80"); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
      const bgP = new THREE.Mesh(new THREE.PlaneGeometry(30, 18), new THREE.MeshBasicMaterial({ map: bg4.t, toneMapped: false })); bgP.position.z = -5; s4.add(bgP);
      const rep = canvasTex(600, 1280, (g, w, h) => { g.fillStyle = "#f4f7fc"; g.fillRect(0, 0, w, h); g.fillStyle = "#f2473a"; g.fillRect(0, 0, w, 150); g.fillStyle = "#fff"; g.font = "800 46px Inter,sans-serif"; g.fillText("LAB REPORT", 40, 95);
        const rows = [["Organism", "ID-A", false], ["Drug A", "S", false], ["Drug B", "R", true], ["Drug C", "S", false], ["Drug D", "I", false], ["Drug E", "R", false]]; rows.forEach(([a, b, hi], i) => { const y = 210 + i * 150; if (hi) { g.fillStyle = "#f6c53c"; g.fillRect(30, y - 20, w - 60, 100); } g.fillStyle = "#12206a"; g.font = "700 44px Inter,sans-serif"; g.fillText(a, 60, y + 45); g.fillText(b, w - 150, y + 45); g.fillStyle = "#c6d3e6"; g.fillRect(40, y + 84, w - 80, 4); }); });
      const phone = new THREE.Group(); phone.add(rbox(0.86, 1.78, 0.09, phys(0x14182a, { metalness: 0.8, roughness: 0.25 }), 0, 0, 0, 0.09));
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 1.7), new THREE.MeshBasicMaterial({ map: rep.t, toneMapped: false })); scr.position.z = 0.047; phone.add(scr); s4.add(phone); phone.position.set(0.4, 0.1, 0);
      const glow4 = ring(0.34, 0.012, new THREE.MeshBasicMaterial({ color: 0xffffff }), 80); glow4.scale.set(1.6, 0.5, 1); glow4.position.set(0.52, -0.05, 0.1); s4.add(glow4);
      const k4 = new THREE.DirectionalLight(0xffffff, 2.6); k4.position.set(-2, 3, 4); k4.castShadow = true; s4.add(k4); s4.add(new THREE.HemisphereLight(0xcfe4ff, 0x1c2a80, 0.8));

      /* ---------- SET 5 / 6 / 7: map ---------- */
      function mapStage(g) {

      }
      const s5 = mkSet(); mapStage(s5); const map5 = indiaMesh(0.062); map5.position.y = 0.0; s5.add(map5);
      const s6 = mkSet(); mapStage(s6); const map6 = indiaMesh(0.062, phys(0xd9a62a, { roughness: 0.3 })); s6.add(map6);
      const spots = [[60, 18, C.red], [72, 32, C.yel], [54, 36, C.red], [66, 58, C.yel], [58, 66, C.red], [44, 26, C.yel], [34, 50, 0xffffff]];

      const s7 = mkSet(); mapStage(s7); const map7 = indiaMesh(0.034, phys(0xd9a62a, { roughness: 0.3 })); map7.position.set(-1.9, 0, 0.2); s7.add(map7);
